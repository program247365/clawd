<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLAWD</title>
<style>
  :root { --bg: #faf9f5; --ink: #141413; --muted: #87867f; --line: #e8e6dc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }
  h1 {
    margin-top: 12vh;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight: 900;
    font-size: clamp(64px, 16vw, 200px);
    letter-spacing: 0.04em;
    line-height: 1;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 260px;
    margin-top: auto;
    border-bottom: 1px solid var(--line);
  }
  #clawd {
    position: absolute; bottom: 0; left: 0;
    width: 360px; height: 242px;
    will-change: transform;
  }
  .anim { position: absolute; inset: 0; visibility: hidden; }
  .anim.on { visibility: visible; }
  #label {
    margin: 18px 0 14vh;
    font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); min-height: 1em;
  }
</style>
</head>
<body>
  <h1>CLAWD</h1>
  <div id="stage"><div id="clawd"></div></div>
  <div id="label"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="assets/clawd-data.js"></script>
<script>
const WIDTH = 360;
const WALK_SPEED = 140;          // px per second
const WALK_FACES_RIGHT = true;   // native facing of the walking animation
const SHORT_ACT_FRAMES = 40;     // acts shorter than this play twice

const stage = document.getElementById('stage');
const clawd = document.getElementById('clawd');
const label = document.getElementById('label');

const players = {};
for (const [name, data] of Object.entries(window.CLAWD)) {
  const el = document.createElement('div');
  el.className = 'anim';
  clawd.appendChild(el);
  const anim = lottie.loadAnimation({
    container: el, renderer: 'canvas', loop: false, autoplay: false, animationData: data,
  });
  players[name] = { el, anim, frames: data.op - data.ip };
}

const actNames = Object.keys(players).filter(n => n !== 'walking');
let queue = [];
function nextAct() {
  if (!queue.length) queue = [...actNames].sort(() => Math.random() - 0.5);
  return queue.pop();
}

let current = null;
// clawd-walking.json: frames 0–4 stand + lean in, 5–24 step cycle, 25–27 stand.
// Looping only the step cycle keeps him from sliding while posed still.
const WALK_CYCLE = [5, 25];

function show(name, { loop = false, segment = null } = {}) {
  if (current) { current.el.classList.remove('on'); current.anim.stop(); }
  current = players[name];
  current.anim.loop = loop;
  if (segment) current.anim.playSegments(segment, true);
  else current.anim.goToAndPlay(0, true);
  current.el.classList.add('on');
}

let x = 40;
let dir = 1;
function place() {
  const flip = (dir === 1) === WALK_FACES_RIGHT ? 1 : -1;
  clawd.style.transform = `translateX(${x}px) scaleX(${flip})`;
}

function walkTo(targetX) {
  dir = targetX >= x ? 1 : -1;
  label.textContent = 'walking';
  show('walking', { loop: true, segment: WALK_CYCLE });
  return new Promise(resolve => {
    let last = performance.now();
    function step(now) {
      const dt = Math.min(now - last, 50) / 1000;
      last = now;
      x += dir * WALK_SPEED * dt;
      if ((dir === 1 && x >= targetX) || (dir === -1 && x <= targetX)) {
        x = targetX; place(); resolve(); return;
      }
      place();
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function perform(name) {
  label.textContent = name.replace(/-/g, ' ');
  show(name);
  const p = players[name];
  let plays = p.frames < SHORT_ACT_FRAMES ? 2 : 1;
  return new Promise(resolve => {
    const done = () => {
      if (--plays > 0) { p.anim.goToAndPlay(0, true); return; }
      p.anim.removeEventListener('complete', done);
      resolve();
    };
    p.anim.addEventListener('complete', done);
  });
}

function randomStop() {
  const max = Math.max(0, stage.clientWidth - WIDTH);
  // Walk at least a third of the stage, alternating direction when there's room.
  const minHop = max / 3;
  const goRight = dir === -1 ? x + minHop <= max : x - minHop < 0;
  return goRight
    ? x + minHop + Math.random() * Math.max(0, max - x - minHop)
    : Math.random() * Math.max(0, x - minHop);
}

async function run() {
  place();
  for (;;) {
    await walkTo(randomStop());
    await perform(nextAct());
  }
}
run();
</script>
</body>
</html>
